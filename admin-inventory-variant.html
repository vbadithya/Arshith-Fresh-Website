<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Variant - Arshith Fresh Admin</title>
  
  <!-- Shared Admin Theme Stylesheet -->
  <link rel="stylesheet" href="admin-styles.css">
  <style>
    .variant-detail-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      margin-top: 16px;
    }
    @media (max-width: 850px) {
      .variant-detail-layout {
        grid-template-columns: 1fr;
      }
    }
    
    .variant-nav-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }
    .variant-product-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 12px;
    }
    .variant-product-thumb {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      border: 1px solid var(--border-color);
    }

    .variant-tab-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      font-size: 13px;
      color: #202223;
      text-decoration: none;
      cursor: pointer;
      margin-bottom: 4px;
      font-weight: 500;
      transition: background 0.15s;
    }
    .variant-tab-item:hover {
      background: #f6f8fa;
    }
    .variant-tab-item.active {
      background: #f1f2f4;
      font-weight: 700;
    }

    .inventory-matrix-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 12px;
    }
    .inventory-matrix-table th {
      color: var(--text-secondary);
      font-size: 11.5px;
      text-align: right;
      padding-bottom: 8px;
    }
    .inventory-matrix-table td {
      text-align: right;
      padding: 8px 0;
      border-top: 1px solid var(--border-subtle);
    }
    .inventory-matrix-table td:first-child, .inventory-matrix-table th:first-child {
      text-align: left;
    }

    /* Switch toggle */
    .switch-toggle {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch-toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider-toggle {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #dcdfe3;
      transition: .2s;
      border-radius: 20px;
    }
    .slider-toggle:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider-toggle {
      background-color: #202223;
    }
    input:checked + .slider-toggle:before {
      transform: translateX(16px);
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <header class="global-topbar">
    <div class="topbar-left">
      <div class="shopify-logo">
        <svg viewBox="0 0 109.5 124.5"><path d="M74.7 14.1c-.2 0-.4.1-.5.1-.2-.8-.6-1.5-1.1-2.2-2.1-2.9-5.7-4.4-10.7-4.4-1.2 0-2.5.1-3.7.4-4.8 1.1-9.4 3.9-13.6 8.3-3 3.1-6.1 7.6-7.8 11.2-.8 1.7-1.5 3.3-2.1 4.7l-15.6 4.8c-4.8 1.5-5 1.9-5.6 6.9L.1 113.1c-.5 4.3 2.5 8 6.8 8.4.4 0 .9 0 1.3-.1l74-15.3c4.5-.9 7.7-4.9 7.4-9.5l-14.9-82.5z"/></svg>
        <span style="font-weight: 700; font-size: 15px; letter-spacing: -0.5px;">shopify</span>
      </div>
    </div>

    <div class="topbar-center">
      <div class="search-box-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" class="global-search-input" placeholder="Search">
        <span class="kbd-shortcut">CTRL K</span>
      </div>
    </div>

    <div class="topbar-right">
      <button class="btn-view-as">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        <span>View as</span>
      </button>

      <button class="notification-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></button>

      <div class="store-profile-dropdown">
        <div class="store-avatar" style="background-color: #278d43; color: #fff; font-weight: 700;">🌱</div>
        <span class="store-name-text">Arshith Fresh</span>
      </div>
    </div>
  </header>

  <!-- App Layout -->
  <div class="app-container">

    <!-- Left Sidebar -->
    <aside class="app-sidebar">
      <div class="sidebar-menu">
        <a href="admin-dashboard.html" class="menu-item">
          <div class="menu-item-left">

            <span>Home</span>
          </div>
        </a>

        <a href="admin-orders.html" class="menu-item">
          <div class="menu-item-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <span>Orders</span>
          </div>
          <span class="badge-count">114</span>
        </a>

        <a href="admin-products.html" class="menu-item active">
          <div class="menu-item-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16.5 9.4 7.55 4.24a1.78 1.78 0 0 0-2.5 1.55v12.42a1.78 1.78 0 0 0 2.5 1.55L16.5 14.6a1.78 1.78 0 0 0 0-3.2z"></path></svg>
            <span>Products</span>
          </div>
        </a>

        <div class="submenu-list">
          <a href="admin-collections.html" class="submenu-item">Collections</a>
          <a href="admin-inventory.html" class="submenu-item active">Inventory</a>
          <a href="admin-purchase-orders.html" class="submenu-item">Purchase orders</a>
          <a href="admin-transfers.html" class="submenu-item">Transfers</a>
          <a href="admin-gift-cards.html" class="submenu-item">Gift cards</a>
        </div>

        <a href="admin-customers.html" class="menu-item">
          <div class="menu-item-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
            <span>Customers</span>
          </div>
        </a>
      </div>
    </aside>

    <!-- Main Viewport -->
        <main class="main-viewport">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; text-align: center; color: var(--text-secondary);">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 16px; opacity: 0.5;"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        <h2 style="font-size: 20px; font-weight: 600; color: #202223; margin-bottom: 8px;">Coming Soon</h2>
        <p style="font-size: 14px; max-width: 400px;">This feature is currently under development. Please check back later.</p>
      </div>
    </main>

  </div>

  <!-- JavaScript -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const title = urlParams.get('title') || 'Ajwain';
      const weight = urlParams.get('weight') || '50g';
      const price = urlParams.get('price') || '₹ 34.00';
      const sku = urlParams.get('sku') || 'S-AJWAIN-50G';

      document.getElementById('variantHeading').textContent = weight;
      document.getElementById('prodTitle').textContent = title;
      document.getElementById('inputWeight').value = weight;
      document.getElementById('subWeightLabel').textContent = weight;
      document.getElementById('inputPrice').value = price;
      document.getElementById('inputSku').value = sku;
    });

    function switchVariant(weight, price, compPrice, avail, sku, el) {
      document.querySelectorAll('.variant-tab-item').forEach(tab => tab.classList.remove('active'));
      el.classList.add('active');

      document.getElementById('variantHeading').textContent = weight;
      document.getElementById('inputWeight').value = weight;
      document.getElementById('subWeightLabel').textContent = weight;
      document.getElementById('inputPrice').value = price;
      document.getElementById('inputComparePrice').value = compPrice;
      document.getElementById('availStockDisplay').textContent = avail;
      document.getElementById('onHandDisplay').textContent = avail;
      document.getElementById('inputSku').value = sku;
    }

    function saveVariant() {
      const btn = document.getElementById('btnSave');
      btn.textContent = "Saving...";
      btn.disabled = true;
      setTimeout(() => {
        btn.textContent = "Save";
        btn.disabled = false;
        alert("Inventory variant saved successfully!");
      }, 500);
    }
  </script>

</body>
</html>
